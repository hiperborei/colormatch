<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1c">
<title>Colormatch</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e9e7;--s1:#f4f4f2;--line:#cfcfcc;--ink:#1c1c1c;--mute:#666663;--btn:#1c1c1c;--btnink:#f4f4f2;--ok:#2f7a48;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1c;--s1:#262626;--line:#3b3b3b;--ink:#ebe9e4;--mute:#a1a09c;--btn:#ebe9e4;--btnink:#1c1c1c;--ok:#8dbb9a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1c1c;--s1:#262626;--line:#3b3b3b;--ink:#ebe9e4;--mute:#a1a09c;--btn:#ebe9e4;--btnink:#1c1c1c;--ok:#8dbb9a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:18px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 4px 14px}
.brand{font-weight:500;font-size:1.05rem;letter-spacing:.02em}
.sub{color:var(--mute);font-size:.82rem;text-align:right}
.split{display:grid;grid-template-columns:1fr 1fr;gap:2px;height:min(58vh,520px);border-radius:20px;overflow:hidden;background:var(--line)}
.pane{position:relative;background:#000;min-width:0;touch-action:manipulation}
.pane canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;left:10px;top:10px;font-size:.74rem;color:#fff;background:rgba(0,0,0,.55);padding:3px 9px;border-radius:99px}
.ret{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.65),inset 0 0 0 1px rgba(0,0,0,.45);pointer-events:none}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;color:#a3a3a0;font-size:.9rem}
.ph[hidden]{display:none}
.msg{color:var(--mute);font-size:.88rem;margin:10px 4px 0;min-height:1.2em}
.read{display:grid;grid-template-columns:68px 1fr 68px;gap:10px;align-items:center;padding:18px 0 6px}
.chip{width:68px;height:68px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
.hx{color:var(--mute);font-size:.74rem;text-align:center;margin-top:5px}
.pct{text-align:center}
.pct b{display:block;font-size:3.8rem;font-weight:200;line-height:1;letter-spacing:-.02em}
.pct b i{font-style:normal;font-size:1.4rem;color:var(--mute);font-weight:300}
.pct span{display:block;font-size:.88rem;color:var(--mute)}
#vd{color:var(--ink);font-weight:500}
button{font:inherit;font-weight:500;font-size:.95rem;border:0;border-radius:14px;padding:15px 18px;cursor:pointer;width:100%}
button:focus-visible,.vr:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
button:disabled{opacity:.4;cursor:default}
.pri{background:var(--btn);color:var(--btnink)}
.sec{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.acts{display:grid;gap:10px;margin:14px 0 8px}
.st{font-size:.84rem;color:var(--mute);margin:0 4px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--ok)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:12px 4px 0}
.thumbs:empty{display:none}
.th{flex:none;width:52px;height:52px;border-radius:10px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4);padding:0;width:52px}
.th.on{outline:2px solid var(--ink);outline-offset:2px}
.blk{border-top:1px solid var(--line);margin-top:22px;padding:22px 4px 0}
.blk[hidden]{display:none}
h2{font-size:1.05rem;font-weight:500;margin:0 0 14px}
h3{font-size:.9rem;font-weight:500;color:var(--mute);margin:18px 0 2px}
.vr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;font-size:.95rem}
h3 + .vr{border-top:0}
.vr span:first-child{color:var(--mute)}
.tip svg{width:100%;height:auto;border-radius:16px;display:block;margin-bottom:14px}
.tip ul{margin:0;padding-left:18px;color:var(--mute);font-size:.92rem}
.tip li{margin-bottom:5px}
.hint{color:var(--mute);font-size:.86rem;margin:14px 0}
.foot{text-align:center;color:var(--mute);font-size:.78rem;margin-top:30px}
</style>
</head>
<body>
<main>
<div class="top"><div class="brand">Colormatch</div><div class="sub" data-i="tag"></div></div>
<div class="split">
 <div class="pane" id="pA"><canvas id="cA"></canvas><div class="tag" data-i="saved"></div><div class="ph" id="phA" data-i="empty"></div><div class="ret" id="rA" hidden></div></div>
 <div class="pane" id="pB"><canvas id="cB"></canvas><div class="tag" data-i="live"></div><div class="ph" id="phB"><button class="pri" id="cam" style="width:auto" data-i="start"></button></div><div class="ret" id="rB" hidden></div></div>
</div>
<p class="msg" id="msg" role="status"></p>
<div class="thumbs" id="thumbs"></div>
<div class="read">
 <div><div class="chip" id="chA"></div><div class="hx" id="hxA">—</div></div>
 <div class="pct"><b id="pct">—</b><span id="vd"></span><span id="de"></span></div>
 <div><div class="chip" id="chB"></div><div class="hx" id="hxB">—</div></div>
</div>
<div class="acts"><button class="pri" id="save" data-i="save" disabled></button><button class="sec" id="lock" data-i="lock" disabled></button></div>
<div class="st"><span class="dot" id="dot"></span><span id="lockSt"></span></div>
<section class="blk" id="params" hidden><h2 data-i="params"></h2><div id="pv"></div><p class="hint" data-i="soon"></p><button class="sec" id="del" data-i="del"></button></section>
<section class="blk tip"><h2 data-i="tipT"></h2>
<svg viewBox="0 0 320 180" aria-hidden="true"><rect width="320" height="180" fill="#262626"/><rect x="12" y="14" width="296" height="152" rx="12" fill="none" stroke="#8a8a87" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="30" y="34" width="176" height="112" rx="6" fill="#b8a78d"/><rect x="176" y="56" width="104" height="70" rx="5" fill="#000" opacity=".3" transform="translate(4 5)"/><rect x="176" y="56" width="104" height="70" rx="5" fill="#f4f4f1"/><circle cx="140" cy="90" r="15" fill="none" stroke="#fff" stroke-width="2"/><circle cx="140" cy="90" r="16.5" fill="none" stroke="#000" stroke-opacity=".5"/></svg>
<ul><li data-i="tip1"></li><li data-i="tip2"></li><li data-i="tip3"></li></ul></section>
<div class="foot">© 2026 Turilov Aleksei</div>
</main>
